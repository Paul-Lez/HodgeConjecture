name = "HodgeConjecture"
keywords = ["math", "algebraic-geometry", "hodge-theory"]
defaultTargets = ["HodgeConjecture", "Other", "CheckStatementImports", "CheckLefschetzOneOneSpec"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.33.0"

[[lean_lib]]
name = "HodgeConjecture"

[[lean_lib]]
name = "Other"

[[lean_lib]]
name = "HodgeGuide"

# Fails the build if the conjecture or Lefschetz specifications import `Other`.
[[lean_lib]]
name = "CheckStatementImports"
srcDir = "scripts"

[[lean_lib]]
name = "CheckLefschetzOneOneSpec"
srcDir = "scripts"

[[lean_exe]]
name = "hodge-guide"
root = "HodgeGuideMain"
