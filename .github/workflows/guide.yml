name: Build and deploy the formalization guide

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Check the style
        run: lake exe lint-style HodgeConjecture Other HodgeGuide
      - name: Build the Lean libraries and the statement-import check
        run: lake build
      - name: Check the import layering
        run: python3 scripts/check_import_layers.py

      - name: Export the trust index
        id: trust
        if: github.event_name != 'pull_request'
        uses: chrisflav/trust-action@v1
        with:
          module: HodgeConjecture
          with-bodies: 'true'
          with-code: 'true'
          setup-lean: 'false'
          publish: ${{ github.ref == 'refs/heads/main' && 'release' || 'false' }}

      - name: Keep the index as an artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trust-index
          path: ${{ steps.trust.outputs.index-root }}
          retention-days: 30

      - name: Build the Verso guide
        if: github.event_name != 'pull_request'
        run: lake exe hodge-guide
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _out/html-multi

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
