name: Build and deploy the formalization guide

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    concurrency:
      group: guide-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Check the style
        run: lake exe lint-style HodgeConjecture Other HodgeGuide
      - name: Build the Lean libraries and the statement-import check
        run: lake build
      - name: Check the import layering
        run: python3 scripts/check_import_layers.py

      - name: Build the Verso guide
        if: github.event_name != 'pull_request'
        run: lake exe hodge-guide
      - name: Regenerate the blueprint dependency graph
        if: github.event_name != 'pull_request'
        run: |
          lake build ImportGraph
          lake env lean --run scripts/BlueprintGraph.lean
          if ! git diff --quiet -- blueprint/src/generated.tex; then
            echo "::warning file=blueprint/src/generated.tex::blueprint/src/generated.tex is out of date; run 'lake env lean --run scripts/BlueprintGraph.lean' and commit the result."
          fi
      - uses: actions/setup-python@v5
        if: github.event_name != 'pull_request'
        with:
          python-version: '3.12'
      - name: Install the blueprint tooling
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
          pip install leanblueprint
      - name: Build the blueprint
        if: github.event_name != 'pull_request'
        run: leanblueprint web
      - name: Add the blueprint to the site
        if: github.event_name != 'pull_request'
        run: cp -r blueprint/web _out/html-multi/blueprint
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _out/html-multi

      # The release upload gets an HTTP 500 from GitHub from time to time, and
      # the guide must still deploy when it does.  The next push republishes.
      - name: Export the trust index
        id: trust
        continue-on-error: true
        if: github.event_name != 'pull_request'
        uses: chrisflav/trust-action@v1
        with:
          module: HodgeConjecture
          with-bodies: 'true'
          with-code: 'true'
          setup-lean: 'false'
          publish: ${{ github.ref == 'refs/heads/main' && 'release' || 'false' }}

      - name: Keep the index as an artifact
        if: steps.trust.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: trust-index
          path: ${{ steps.trust.outputs.index-root }}
          retention-days: 30

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
